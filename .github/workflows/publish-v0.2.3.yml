name: Publish v0.2.3 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the existing v0.2.3 tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create v0.2.3 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.3" \
            --notes "Adds a saved dome rotation angle in degrees. Rotation requests stop and confirm existing movement before starting the new step; manual Stop cancels pending requests. Removes duplicate shutter buttons and retains the standard cover control."
