name: Publish v0.2.5 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.2.5.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.2.5 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.5" \
            --notes "Retry getStatus once after transient network failures or temporary HTTP server errors to reduce brief unavailable readings. Release the request lock during the retry delay so Stop can run. Report request timeouts, network exception types, and HTTP status codes separately. Continued failures still report unavailable and block new movement using old status. Movement commands are never automatically repeated. Verified with 41 simulated tests; physical controller behavior requires confirmation after updating. Update through HACS and restart Home Assistant."
