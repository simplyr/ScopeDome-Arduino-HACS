name: Publish v0.2.10 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.2.10.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.2.10 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.10" \
            --notes "Add debug diagnostics for selected rotation angle, effective encoder calibration, raw starting count, exact movement command and acknowledgement. Log raw encoder and motor state on existing status reads. No movement or polling behavior changes. Enable integration debug logging to collect diagnostics. Verified with 58 simulated tests. Update through HACS and restart Home Assistant."
