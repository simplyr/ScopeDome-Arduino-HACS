name: Publish v0.1.1 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create v0.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.1.1" \
            --notes "Initial versioned HACS release. Fixes the Home Assistant setup form."
