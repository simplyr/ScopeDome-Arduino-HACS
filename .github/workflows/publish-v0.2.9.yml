name: Publish v0.2.9 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.2.9.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.2.9 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.9" \
            --notes "Accept movement acknowledgements that echo the command verb without its arguments, such as moveDome|OK| in response to moveDome=CW:9. This covers relative rotation, Park, GoTo azimuth and shutter commands while preserving full-request and bare OK compatibility. Reject explicit errors, malformed replies, and acknowledgements for a different command. Movement commands are never automatically repeated. Explain that movement may already have started when a reply is unrecognized. Verified with 58 simulated tests; hardware confirmation is still required. Update through HACS and restart Home Assistant."
