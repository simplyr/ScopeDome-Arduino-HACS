name: Publish v0.2.2 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.2.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the existing v0.2.2 tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create v0.2.2 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.2" \
            --notes "Reads getCalibratedRotation automatically with an optional manual fallback. Adds azimuth in degrees, minutes, and seconds and increases decimal display precision."
