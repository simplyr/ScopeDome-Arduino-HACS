name: Publish v0.2.8 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.2.8.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.2.8 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.8" \
            --notes "Add native Find home, Go to park, a restored Dome target azimuth input from 0 to 360 degrees, and Go to azimuth. GoTo uses calibrated shortest-path encoder movement, confirms Stop before redirecting, and shares Stop cancellation with relative rotation. Cloud emergency code 3 no longer blocks manual dome rotation or produces the previous action-error notification; cloud alarm indications and controller weather rules remain active. Digital, analog, unknown alarms and other rotation interlocks still block movement. Add Rain detected with active LOW interpretation for the official ScopeDome sensor and a configurable input polarity; keep Shutter rain input as the raw signal. Verified with 55 simulated tests and dashboard YAML checks. Physical hardware confirmation is still required. Update through HACS and restart Home Assistant."
