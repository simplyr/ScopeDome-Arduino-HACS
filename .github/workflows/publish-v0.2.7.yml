name: Publish v0.2.7 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.2.7.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.2.7 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.7" \
            --notes "Replace ambiguous movement errors with the specific reported condition: Shutter card offline, Dome safety alarm, or Shutter safety alarm. Include alarm type and code and list simultaneous conditions together. Existing movement interlocks remain enforced; this update does not clear controller alarms. Check the device Diagnostics to identify the condition preventing movement. Verified with 43 simulated tests. Update through HACS and restart Home Assistant."
