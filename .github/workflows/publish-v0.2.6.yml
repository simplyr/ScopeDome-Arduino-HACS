name: Publish v0.2.6 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.2.6.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing tag as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.2.6 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v0.2.6" \
            --notes "Move Shutter rain input from Diagnostics to Sensors alongside Cloudy. Keep its existing entity ID and state interpretation. Update through HACS and restart Home Assistant."
